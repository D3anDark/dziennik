[package]
name = "dziennik"
version = "0.1.0"
license = "MIT"
edition = "2024"

[dependencies]
aes-gcm = "0.11"
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.23"
getrandom = "0.4.3"
regex = "1"
reqwest = { version = "0.13", features = ["json", "multipart", "cookies", "form", "stream"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tower-http = { version = "0.7", features = ["fs", "set-header"] }
